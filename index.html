  :root{
    /* Značkové barvy FC Písek (z loga a klubového webu) */
    --blue:#223080;          /* královská modrá — hlavičky, nadpisy */
    --blue-deep:#161f56;     /* tmavší modrá pro přechody a hover */
    --blue-700:#1b2569;
    --gold:#FCC400;          /* klubová žlutá — akcenty, tlačítka */
    --gold-deep:#e3af00;
    --gold-soft:#fff4d1;     /* měkký žlutý podklad pro odznaky */

    --bg:#f3f4f8;
    --card:#ffffff;
    --card-hover:#fbfbfe;
    --line:#e2e4ee;
    --line-strong:#d3d6e6;
    --text:#161a2e;
    --text-dim:#63677e;

    --fs-date:13px;
    --fs-date-day:14px;
    --fs-teams:19px;
    --fs-phase:12px;
    --fs-tag:12px;
    --fs-btn:14px;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  /* Modro-žlutý proužek nad hlavičkou (klubové barvy) */
  .stripes{
    height:5px;width:100%;
    background:linear-gradient(90deg,var(--blue) 0 60%,var(--gold) 60% 100%);
  }
  header{position:sticky;top:0;z-index:50;background:var(--blue);border-bottom:3px solid var(--gold);}
  .nav{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{height:46px;width:auto;display:block;}
  .wordmark{
    display:flex;align-items:baseline;gap:8px;line-height:1;
  }
  .wordmark .fc{
    font-family:"Chaney Extended","Barlow Condensed",sans-serif;
    font-size:22px;letter-spacing:0.5px;color:#fff;
  }
  .wordmark .tv{
    font-family:"Chaney Extended","Barlow Condensed",sans-serif;
    font-size:15px;letter-spacing:1px;
    color:var(--blue);background:var(--gold);padding:3px 7px;border-radius:4px;
  }
  .platform-note{
    font-size:11px;color:rgba(255,255,255,0.72);
    border-left:1px solid rgba(255,255,255,0.22);padding-left:14px;
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .platform-note a{color:rgba(255,255,255,0.72);text-decoration:underline;text-underline-offset:2px;}
  .platform-note a:hover{color:var(--gold);}
  nav.links{display:flex;align-items:center;gap:24px;font-size:14px;color:rgba(255,255,255,0.82);text-transform:uppercase;letter-spacing:0.3px;font-weight:600;}
  nav.links a:hover{color:var(--gold);}

  main{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

  .section-title{
    display:flex;align-items:center;gap:12px;
    font-family:"Chaney","Barlow Condensed",sans-serif;
    font-size:22px;letter-spacing:0.5px;color:var(--blue);
    margin:40px 0 16px;text-transform:uppercase;
  }
  .section-title::after{content:"";flex:1;height:2px;background:var(--line-strong);}
  .section-title:first-child{margin-top:0;}
  .dot-live{width:9px;height:9px;border-radius:50%;background:#e11d2a;box-shadow:0 0 0 4px rgba(225,29,42,0.20);}

  /* ---- hlavní (featured) zápas ---- */
  .hero-match{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 2px 12px rgba(34,48,128,0.07);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .hero-match:hover{border-color:var(--gold);box-shadow:0 6px 22px rgba(34,48,128,0.12);}
  .hero-thumb{
    position:relative;
    min-height:270px;
    background:
      radial-gradient(120% 140% at 82% 18%, rgba(255,255,255,0.14) 0%, transparent 55%),
      repeating-linear-gradient(122deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 34px),
      linear-gradient(140deg, var(--blue) 0%, var(--blue-deep) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-thumb::before{ /* žlutý roh — odkaz na klubovou žlutou */
    content:"";position:absolute;top:0;left:0;
    border-top:56px solid var(--gold);border-right:56px solid transparent;
  }
  .hero-thumb::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,0.16));
  }
  .play-badge{
    width:74px;height:74px;border-radius:50%;
    background:var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(0,0,0,0.32);position:relative;z-index:1;
  }
  .play-badge svg{width:26px;height:26px;fill:var(--blue);margin-left:4px;}
  .hero-info{padding:32px 30px;display:flex;flex-direction:column;justify-content:center;}
  .hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-dim);margin-bottom:14px;font-weight:600;}
  .hero-tags{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .hero-opponent{
    font-family:"Chaney","Barlow Condensed",sans-serif;
    font-size:38px;line-height:1.02;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:0.3px;
  }
  .hero-meta{font-size:14px;color:var(--text-dim);margin-bottom:22px;}
  .hero-meta b{color:var(--text);font-weight:600;}
  .btn-play-lg{
    align-self:flex-start;
    display:inline-flex;align-items:center;gap:9px;
    background:var(--blue);color:#fff;font-weight:700;font-size:14px;
    padding:12px 22px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;
    transition:background .15s ease;
  }
  .btn-play-lg:hover{background:var(--blue-deep);}
  .btn-play-lg svg{width:13px;height:13px;fill:#fff;}

  /* ---- řada 3 karet ---- */
  .cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .match-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
    box-shadow:0 1px 2px rgba(34,48,128,0.04);
    border-top:3px solid var(--gold);
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .match-card:hover{background:var(--card-hover);border-color:var(--line-strong);border-top-color:var(--gold);box-shadow:0 6px 16px rgba(34,48,128,0.10);}
  .card-top{display:flex;align-items:center;justify-content:space-between;}
  .card-date{font-size:var(--fs-date);color:var(--text-dim);}
  .card-opponent{font-family:"Chaney","Barlow Condensed",sans-serif;font-size:19px;color:var(--blue);line-height:1.08;text-transform:uppercase;}
  .card-phase{font-size:var(--fs-phase);color:var(--text-dim);}
  .card-action{margin-top:auto;}

  /* ---- sdílené odznaky ---- */
  .tag-home, .tag-away{font-size:var(--fs-tag);font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:5px;display:inline-block;text-transform:uppercase;}
  .tag-home{background:var(--gold-soft);color:#8a6d00;}
  .tag-away{background:rgba(34,48,128,0.08);color:var(--blue);}

  .btn-play{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;font-weight:700;font-size:var(--fs-btn);padding:8px 14px;border-radius:8px;border:none;font-family:inherit;cursor:pointer;transition:background .15s ease;}
  .btn-play:hover{background:var(--blue-deep);}
  .btn-play svg{width:11px;height:11px;fill:#fff;}
  .btn-soon{font-size:var(--fs-btn);color:var(--text-dim);background:transparent;border:1px solid var(--line-strong);padding:8px 12px;border-radius:8px;display:inline-block;}

  /* ---- přepínač sezón ---- */
  .season-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .season-tab{
    background:var(--card);border:1px solid var(--line-strong);color:var(--text-dim);
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;
    cursor:pointer;font-family:inherit;
  }
  .season-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .season-tab:not(.active):hover{border-color:var(--gold);color:var(--text);}

  /* ---- filtry + seznam ---- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .filter-toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--line-strong);border-radius:9px;padding:4px;}
  .filter-btn{background:transparent;border:none;color:var(--text-dim);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;font-family:inherit;cursor:pointer;}
  .filter-btn.active{background:var(--blue);color:#fff;}
  .filter-select{background:var(--card);border:1px solid var(--line-strong);color:var(--text);font-size:13px;padding:9px 12px;border-radius:9px;font-family:inherit;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--text-dim);stroke-width:2;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--line-strong);color:var(--text);font-size:13px;padding:9px 12px 9px 34px;border-radius:9px;font-family:inherit;}
  .search-wrap input::placeholder{color:var(--text-dim);}
  .search-wrap input:focus{outline:none;border-color:var(--gold);}
  .results-count{font-size:12px;color:var(--text-dim);margin:-4px 0 14px;}

  .match-list{display:flex;flex-direction:column;gap:8px;}
  .match{display:grid;grid-template-columns:100px 1fr 130px 140px;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;transition:background .15s ease, border-color .15s ease;}
  .match.playable{cursor:pointer;}
  .match.playable:hover{background:var(--card-hover);border-color:var(--gold);}
  .m-date{font-size:var(--fs-date);color:var(--text-dim);line-height:1.3;}
  .m-date b{display:block;color:var(--text);font-size:var(--fs-date-day);}
  .m-teams{font-size:var(--fs-teams);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .opp-name{font-family:"Chaney","Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:0.2px;color:var(--blue);font-size:17px;}
  .m-phase{font-size:var(--fs-phase);color:var(--text-dim);text-align:right;}
  .m-action{display:flex;justify-content:flex-end;}

  .empty-box{border:1px dashed var(--line-strong);border-radius:12px;padding:24px;text-align:center;color:var(--text-dim);font-size:14px;background:var(--card);}

  footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--text-dim);font-size:12px;}
  footer a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--blue);}

  .overlay{position:fixed;inset:0;background:rgba(15,20,50,0.88);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.open{display:flex;}
  .player{width:100%;max-width:920px;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .player-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);}
  .player-head h3{margin:0;font-size:15px;font-weight:700;color:var(--blue);}
  .player-head .close{cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;background:none;border:none;}
  .player-head .close:hover{color:var(--blue);}
  .video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  @media (max-width:800px){
    .hero-match{grid-template-columns:1fr;}
    .hero-thumb{min-height:180px;}
    .cards-row{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .match{grid-template-columns:1fr;gap:6px;text-align:left;}
    .m-phase{text-align:left;}
    .m-action{justify-content:flex-start;}
    nav.links{display:none;}
    .platform-note{display:none;}
  }
</style>
</head>

<script>
let matches = [];

const PLAY_ICON = `<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6V2z"/></svg>`;
const state = { season: null, loc: "all", phase: "all", q: "" };

// Kolik hodin po výkopu ještě považujeme zápas za "živě" (rozehrání +
// 2 poločasy + přestávka + rezerva na dojezd přenosu).
const LIVE_WINDOW_HOURS = 2.5;
const PRE_SHOW_MINUTES = 15;

const OUR_MARK = "Písek"; // označení našeho týmu v datech (FC Písek)
function opponentOf(m){ return m.us === "home" ? m.away : m.home; }
function tagOf(m){ return m.us === "home" ? `<span class="tag-home">DOMA</span>` : `<span class="tag-away">VENKU</span>`; }

function parseStart(m){
  const [d, mo, y] = m.date.split(".").map(s => parseInt(s.trim(), 10));
  const [hh, mm] = m.time.split(":").map(Number);
  return new Date(y, mo - 1, d, hh, mm);
}

function statusOf(m, now){
  const start = parseStart(m);
  const liveFrom = new Date(start.getTime() - PRE_SHOW_MINUTES * 60000);
  const liveUntil = new Date(start.getTime() + LIVE_WINDOW_HOURS * 3600000);
  if(now >= liveFrom && now <= liveUntil) return "live";
  if(now < liveFrom) return "upcoming";
  return "past";
}

// Vybere, co se ukáže jako hlavní karta: živý zápas > nejbližší naplánovaný
// > poslední odehraný. Hledá napříč VŠEMI sezónami — nezávisle na tom,
// jaká sezóna je zrovna vybraná v přepínači níž.
function pickFeatured(withStatus){
  const live = withStatus.find(m => m.status === "live");
  if(live) return live;
  const upcoming = withStatus.filter(m => m.status === "upcoming").sort((a, b) => a.start - b.start);
  if(upcoming.length) return upcoming[0];
  const past = withStatus.filter(m => m.status === "past").sort((a, b) => b.start - a.start);
  return past[0] || null;
}

function renderHero(featured){
  const titleEl = document.getElementById("heroSectionTitle");
  const el = document.getElementById("heroMatch");

  if(!featured){
    titleEl.textContent = "Zápasy";
    el.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Zatím žádné zápasy k zobrazení.</div>`;
    return;
  }

  const m = featured;
  el.onclick = null;

  if(m.status === "live"){
    titleEl.innerHTML = `<span class="dot-live"></span> Živě`;
    const playable = !!m.embed;
    if(playable) el.onclick = () => openPlayer(m._i);
    el.innerHTML = `
      <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
      <div class="hero-info">
        <div class="hero-eyebrow">Právě se hraje · ${m.phase}</div>
        <div class="hero-tags">${tagOf(m)}</div>
        <h2 class="hero-opponent">${opponentOf(m)}</h2>
        <div class="hero-meta">Výkop <b>${m.time}</b> · ${m.date}</div>
        ${playable
          ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Sledovat živě</button>`
          : `<span class="btn-soon">Přenos se spouští, chvíli strpení…</span>`}
      </div>`;
    return;
  }

  if(m.status === "upcoming"){
    titleEl.textContent = "Nejbližší zápas";
    const playable = !!m.embed;
    if(playable) el.onclick = () => openPlayer(m._i);
    el.innerHTML = `
      <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
      <div class="hero-info">
        <div class="hero-eyebrow">${m.phase}</div>
        <div class="hero-tags">${tagOf(m)}</div>
        <h2 class="hero-opponent">${opponentOf(m)}</h2>
        <div class="hero-meta">Výkop <b>${m.time}</b> · ${m.date}</div>
        ${playable
          ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Přehrát</button>`
          : `<span class="btn-soon">Zápas ještě nezačal</span>`}
      </div>`;
    return;
  }

  titleEl.textContent = "Poslední zápas";
  const playable = !!m.embed;
  if(playable) el.onclick = () => openPlayer(m._i);
  el.innerHTML = `
    <div class="hero-thumb"><div class="play-badge">${PLAY_ICON}</div></div>
    <div class="hero-info">
      <div class="hero-eyebrow">${m.phase}</div>
      <div class="hero-tags">${tagOf(m)}</div>
      <h2 class="hero-opponent">${opponentOf(m)}</h2>
      <div class="hero-meta"><b>${m.date}</b> · ${m.time}</div>
      ${playable
        ? `<button class="btn-play-lg" type="button">${PLAY_ICON}Přehrát záznam</button>`
        : `<span class="btn-soon">Zatím bez videa</span>`}
    </div>`;
}

// Zápasy, ze kterých se plní karty a seznam pod "Odehrané zápasy" —
// VŽDY jen odehrané (status "past"), nikdy budoucí, i kdyby to znamenalo
// sáhnout do předchozí sezóny. Naplánované zápasy se ukazují výhradně
// jednou, jako hlavní karta nahoře.
function pastPool(withStatus, featured){
  return withStatus
    .filter(m => m.status === "past" && m !== featured && m.season === state.season)
    .sort((a, b) => b.start - a.start);
}

function renderCards(pool){
  const row = document.getElementById("cardsRow");
  const cardMatches = pool.slice(0, 3);

  if(cardMatches.length === 0){
    row.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">V týhle sezóně zatím nejsou žádné odehrané zápasy.</div>`;
    return;
  }

  row.innerHTML = cardMatches.map((m) => {
    const playable = !!m.embed;
    const action = playable
      ? `<button class="btn-play" type="button">${PLAY_ICON}Přehrát</button>`
      : `<span class="btn-soon">bez videa</span>`;
    return `
      <div class="match-card" ${playable ? `onclick="openPlayer(${m._i})"` : ""}>
        <div class="card-top"><span class="card-date">${m.date} · ${m.time}</span>${tagOf(m)}</div>
        <div class="card-opponent">${opponentOf(m)}</div>
        <div class="card-phase">${m.phase}</div>
        <div class="card-action">${action}</div>
      </div>`;
  }).join("");
}

function renderSeasonTabs(seasons){
  const box = document.getElementById("seasonTabs");
  box.innerHTML = seasons.map(s =>
    `<button class="season-tab ${s === state.season ? 'active' : ''}" data-season="${s}" type="button">${s}</button>`
  ).join("");
  box.querySelectorAll(".season-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      state.season = btn.dataset.season;
      refreshSeasonView();
    });
  });
}

function uniquePhases(rest){
  const seen = new Set(); const order = [];
  rest.forEach(m => { if(!seen.has(m.phase)){ seen.add(m.phase); order.push(m.phase); } });
  return order;
}
function populatePhaseSelect(rest){
  const sel = document.getElementById("phaseSelect");
  sel.innerHTML = `<option value="all">Všechna kola</option>`;
  uniquePhases(rest).forEach(p => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}
function passesFilter(m){
  if(state.loc !== "all" && m.us !== state.loc) return false;
  if(state.phase !== "all" && m.phase !== state.phase) return false;
  if(state.q){
    const opp = opponentOf(m).toLowerCase();
    if(!opp.includes(state.q)) return false;
  }
  return true;
}
function renderList(){
  const list = document.getElementById("matchList");
  const rest = window.__listRest || [];

  // Když v téhle sezóně nejsou žádné další odehrané zápasy nad rámec tří
  // karet nahoře, seznam prostě schováme (není co filtrovat).
  if(rest.length === 0){
    list.innerHTML = "";
    return;
  }

  const rows = rest.filter(passesFilter);
  if(rows.length === 0){
    list.innerHTML = `<div class="empty-box">Žádný zápas neodpovídá filtru.</div>`;
    return;
  }
  list.innerHTML = rows.map((m) => {
    const playable = !!m.embed;
    const action = playable
      ? `<button class="btn-play" type="button">${PLAY_ICON}Přehrát</button>`
      : `<span class="btn-soon">bez videa</span>`;
    return `
      <div class="match ${playable ? 'playable' : ''}" ${playable ? `onclick="openPlayer(${m._i})"` : ""}>
        <div class="m-date"><b>${m.date}</b>${m.time}</div>
        <div class="m-teams">${tagOf(m)}<span class="opp-name">${opponentOf(m)}</span></div>
        <div class="m-phase">${m.phase}</div>
        <div class="m-action">${action}</div>
      </div>`;
  }).join("");
}

let __withStatus = [];
let __featured = null;

function refreshSeasonView(){
  document.querySelectorAll(".season-tab").forEach(b => b.classList.toggle("active", b.dataset.season === state.season));
  const pool = pastPool(__withStatus, __featured);
  renderCards(pool);
  window.__listRest = pool.slice(3);
  state.loc = "all"; state.phase = "all"; state.q = "";
  document.getElementById("searchInput").value = "";
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.loc === "all"));
  populatePhaseSelect(window.__listRest);
  renderList();
}

function openPlayer(i){
  const m = matches[i];
  if(!m.embed) return;
  document.getElementById("playerTitle").textContent = `${m.home} – ${m.away} · ${m.date}`;
  document.getElementById("playerFrame").src = `https://embed.tvcom.cz/${m.embed}/`;
  document.getElementById("overlay").classList.add("open");
}
function closePlayer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("playerFrame").src = "";
}
document.getElementById("overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") closePlayer(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closePlayer(); });

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.loc = btn.dataset.loc;
    renderList();
  });
});
document.getElementById("phaseSelect").addEventListener("change", (e) => { state.phase = e.target.value; renderList(); });
document.getElementById("searchInput").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); renderList(); });

async function loadMatches(){
  const heroEl = document.getElementById("heroMatch");
  heroEl.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Načítám zápasy…</div>`;
  try {
    const res = await fetch("data/matches.json", { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    matches = await res.json();
  } catch(err) {
    console.error("Nepodařilo se načíst data/matches.json:", err);
    heroEl.innerHTML = `<div class="empty-box" style="grid-column:1/-1;">Data zápasů se nepodařilo načíst. Zkuste stránku znovu načíst za chvíli.</div>`;
    return;
  }

  const now = new Date();
  __withStatus = matches.map((m, i) => ({ ...m, _i: i, start: parseStart(m), status: statusOf(m, now) }));

  __featured = pickFeatured(__withStatus);
  renderHero(__featured);

  const seasons = [...new Set(matches.map(m => m.season))].sort().reverse();

  // Výchozí sezóna = sezóna posledního odehraného zápasu (ne kalendářní
  // dnešek — na startu nové sezóny by jinak byl seznam prázdný).
  const mostRecentPast = __withStatus.filter(m => m.status === "past").sort((a, b) => b.start - a.start)[0];
  state.season = mostRecentPast ? mostRecentPast.season : seasons[0];

  renderSeasonTabs(seasons);
  refreshSeasonView();
}

loadMatches();
</script>
